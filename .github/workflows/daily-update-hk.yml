name: Daily HK Portfolio Update
on:
    schedule:
      # GitHub free-tier schedules drift 1.5-6h and SKIP ENTIRELY at random
      # (Jun 15 2026: the 08:45 slot never fired). The snapshot write is
      # idempotent per date, so firing several times a day is harmless — a
      # re-run just rewrites the same settled values. We therefore fan out
      # FIVE slots across update.py's valid window (16:10 HKT / 08:10 UTC →
      # midnight HKT / 16:00 UTC); the guard aborts anything outside it.
      # Goal: at least one of the five lands even when GitHub drops some.
      # 16:35 HKT — 25 min after the Closing Auction ends (16:10 HKT). Moved
      # from 16:45 on Dany's request 2026-08-10 (close 16:00 -> CAS to 16:15
      # -> 15min settle -> fixed by 16:30, +5min buffer). NOTE: an earlier
      # note on this line said 16:30 was tested and found too early for
      # TradingView Scanner's post-CAS flush — 16:35 is only 5 min past that,
      # so it carries the same risk. Not corrective if it misses: the backup
      # slots below still fan out and self-heal (see wiki/incidents.md
      # 2026-08-10 for the reasoning + the backfilled runbook check).
      - cron: '35 8 * * 1-5'   # 16:35 HKT — primary
      - cron: '0 10 * * 1-5'   # 18:00 HKT — backup 1
      - cron: '0 12 * * 1-5'   # 20:00 HKT — backup 2
      - cron: '0 13 * * 1-5'   # 21:00 HKT — backup 3
      - cron: '0 15 * * 1-5'   # 23:00 HKT — backup 4 (last before midnight HKT)
      #
      # DRIFT CATCHERS (2026-09-08, reliability-risks.md #8 reopened).
      # The five slots above are all scheduled INSIDE the valid window, so the
      # fleet only tolerates as much drift as its earliest slot has headroom:
      # 16:00 UTC − 08:35 UTC = 7h25m. Observed drift blew past that on three
      # sessions and lost them outright — every slot shifted by roughly the
      # SAME amount each time (uniform backlog, not per-slot jitter), so extra
      # in-window slots buy nothing:
      #   2026-08-27  all 5 slots +9h10m .. +10h38m  -> session lost
      #   2026-08-28  all 5 slots +9h47m .. +10h19m  -> session lost (landed Sat)
      #   2026-08-31  all 5 slots +5h31m .. +7h45m   -> session lost
      # These three are scheduled BEFORE the window on purpose: undrifted they
      # are no-ops (refused by WINDOW_START, and now they check the prior
      # session before exiting), drifted they land inside it. Each covers a
      # 7h50m-wide drift band; together with the primary they tile [0, 13h19m]
      # with no gap, nearly doubling the tolerated drift.
      # Off-hour minutes deliberately: GitHub's scheduler queues worst on the hour.
      - cron: '17 6 * * 1-5'   # 14:17 HKT undrifted — in-window for 1h53m–9h43m drift
      - cron: '23 4 * * 1-5'   # 12:23 HKT undrifted — in-window for 3h47m–11h37m drift
      - cron: '41 2 * * 1-5'   # 10:41 HKT undrifted — in-window for 5h29m–13h19m drift
    workflow_dispatch:
jobs:
    update:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-python@v6
          with:
            python-version: '3.12'
        - name: Install dependencies
          run: pip install firebase-admin
        - name: Fetch prices and update Firestore
          env:
            FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          run: python update.py
        - name: Verify snapshot vs TradingView (fails the run on drift)
          env:
            FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          run: python verify-daily.py hk
